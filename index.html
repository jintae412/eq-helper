<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#111111" />
    <link rel="icon" href="/eq-helper/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/eq-helper/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="EQ Helper" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>EQ Helper</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #111; color: #eee; }
      main { max-width: 900px; margin: 0 auto; padding: 16px; }
      button { font-size: 1rem; padding: 10px 16px; min-height: 44px; border-radius: 8px; border: 0; background: #2d6cdf; color: #fff; }
      :focus-visible { outline: 3px solid #4fc3f7; outline-offset: 2px; }
      select, input:not([type='checkbox']):not([type='range']) { min-height: 44px; box-sizing: border-box; }
      @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
      button.danger { background: #c62828; }
      button.quiet { background: #333; }
      input { font-size: 1rem; padding: 8px; border-radius: 8px; border: 1px solid #444; background: #1c1c1c; color: #eee; }
      canvas { width: 100%; height: auto; background: #181818; border-radius: 8px; display: block; }
      pre { background: #1c1c1c; padding: 8px; border-radius: 8px; overflow-x: auto; font-size: 0.8rem; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
      .error { color: #ff6b6b; }
      main { padding-top: calc(16px + env(safe-area-inset-top)); padding-bottom: calc(88px + env(safe-area-inset-bottom)); }
      h1 { margin-top: 0.5rem; }
      h3 { margin: 16px 0 6px; font-size: 1rem; }
      select { font-size: 1rem; padding: 8px; border-radius: 8px; border: 1px solid #444; background: #1c1c1c; color: #eee; }
      button:disabled { opacity: 0.4; }
      button.link { background: none; padding: 0 4px; min-height: 0; color: #4fc3f7; text-decoration: underline; }
      .muted { color: #999; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; }
      .chip { background: #262626; border: 1px solid #3a3a3a; min-height: 44px; }
      .chip[aria-pressed='true'] { background: #2d6cdf; border-color: #2d6cdf; }
      .card { background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 12px; padding: 12px 16px; margin: 12px 0; }
      .card h2 { margin-top: 4px; }
      .field { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; color: #bbb; font-size: 0.9rem; }
      .field.inline { margin: 0; }
      input.short { width: 9rem; }
      input.num { width: 5rem; }
      input[type='search'] { flex: 1; min-width: 0; }
      input[type='range'] { width: 100%; min-height: 44px; }
      .band { align-items: flex-end; padding-bottom: 8px; border-bottom: 1px solid #2c2c2c; }
      .banner { position: sticky; top: env(safe-area-inset-top); z-index: 10; max-height: 50vh; overflow-y: auto; background: #4a1010; border: 1px solid #c62828; border-radius: 0 0 12px 12px; padding: 8px 12px; margin: 0 -16px 8px; }
      .banner-item + .banner-item { border-top: 1px solid #c62828; margin-top: 8px; padding-top: 8px; }
      .banner-item p { margin: 4px 0; }
      .banner .row { margin: 8px 0 4px; }
      .check { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
      .check { min-height: 44px; }
      .check input { width: 24px; height: 24px; }
      .log { padding-left: 20px; }
      .log li { margin: 6px 0; }
      details { margin: 12px 0; }
      summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: 600; }
      .inline-icon { width: 1.2em; height: 1.2em; vertical-align: -0.2em; color: #4fc3f7; }
      a { color: #4fc3f7; }
      a.button-link { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 8px; background: #2d6cdf; color: #fff; text-decoration: none; }
      .card.secondary { padding: 8px 14px; }
      .card.secondary h3 { font-size: 0.95rem; }
      .card h3 { margin-top: 4px; }
      .note { color: #ffcc80; font-size: 0.9rem; margin: 4px 0; }
      .segmented { display: inline-flex; border: 1px solid #3a3a3a; border-radius: 8px; overflow: hidden; }
      .segmented button { background: #262626; border-radius: 0; }
      .segmented button[aria-pressed='true'] { background: #2d6cdf; }
      .segmented.wide { display: flex; margin: 16px 0 4px; }
      .segmented.wide button { flex: 1; }
      progress { width: 100%; height: 12px; }
      .sweep { border-top: 1px solid #2c2c2c; margin-top: 8px; padding-top: 8px; }
      .peak { font-size: 1.3rem; }
      .glossary div { margin: 8px 0; }
      .glossary dt { font-weight: 600; }
      .glossary dd { margin: 2px 0 0; color: #bbb; }
      .freq-chart { display: grid; grid-template-columns: minmax(6rem, 9rem) 1fr; gap: 6px 10px; align-items: center; }
      .freq-label { font-size: 0.85rem; color: #bbb; }
      .freq-axis { position: relative; height: 1.3em; font-size: 0.7rem; color: #888; font-variant-numeric: tabular-nums; }
      .freq-axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
      .freq-axis span.major { color: #ddd; }
      .freq-axis span:first-child { transform: none; }
      .freq-bar { position: relative; height: 14px; background: #262626; border-radius: 4px; overflow: hidden; }
      .freq-bar .fill { position: absolute; top: 0; bottom: 0; min-width: 4px; background: #4fc3f7; border-radius: 4px; }
      .freq-bar .fill.notes { background: #ba68c8; }
      .freq-bar .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255, 255, 255, 0.14); }
      .freq-bar .tick.major { background: rgba(255, 255, 255, 0.4); }
      @media (max-width: 560px) {
        .freq-chart { grid-template-columns: 1fr; gap: 2px; }
        .freq-spacer { display: none; }
        .freq-bar { margin-bottom: 6px; }
      }
      .ref-row p { margin: 4px 0; }
      .boost { color: #81c784; margin-right: 4px; }
      .cut { color: #ffb74d; margin-right: 4px; }
      .tabs { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #181818; border-top: 1px solid #2c2c2c; padding-bottom: env(safe-area-inset-bottom); }
      .tabs button { flex: 1; background: none; border-radius: 0; padding: 16px 0; color: #999; }
      .tabs button[aria-current='page'] { color: #4fc3f7; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
